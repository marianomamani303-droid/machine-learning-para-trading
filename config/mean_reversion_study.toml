# Fixed hypotheses; no search or selection based on the observed historical test.
[research]
lookbacks = [20, 60]
regime_filters = ["all", "sideways"]
boundaries = ["2022-01-01", "2022-07-01", "2023-01-01", "2023-07-01", "2024-01-01", "2024-07-01", "2025-01-01", "2025-06-05"]
historical_end = "2026-10-01"
minimum_train_opportunities = 20
probability_threshold = 0.55
seed = 42
max_fits = 72
prospective_days = 180

[rules]
rsi_window = 14
volatility_window = 20
atr_window = 14
entry_z = -2.0
maximum_rsi = 0.40
stop_atr = 2.0
max_holding_bars = 10
risk_fraction = 0.01
max_allocation = 0.50

[costs]
commission_bps = 10.0
slippage_bps = 5.0
spread_bps = 2.0
annual_holding_bps = 0.0
annual_cash_rate = 0.0
initial_capital = 10000.0

[stress]
cost_multiplier = 2.0

[logistic]
C = 1.0
max_iter = 2000

[xgboost]
n_estimators = 120
max_depth = 2
learning_rate = 0.03
subsample = 0.85
colsample_bytree = 0.85
reg_lambda = 10.0
min_child_weight = 10

[bootstrap]
samples = 2000
block_lengths = [7, 30]
confidence = 0.95

[acceptance]
minimum_trades = 20
required_positive_fold_fraction = 0.60
