# Fixed hypotheses. All historical dates have already been inspected in prior research.
[research]
reference_version = "v20261012T130540_d2bb6ac0"
boundaries = ["2022-01-01", "2022-07-01", "2023-01-01", "2023-07-01", "2024-01-01", "2025-01-01", "2026-10-01"]
