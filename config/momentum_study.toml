# Four hypotheses fixed before this run; no parameter or threshold search.
[research]
lookbacks = [20, 60, 120, 250]
boundaries = ["2022-01-01", "2022-07-01", "2023-01-01", "2023-07-01", "2024-01-01", "2024-07-01", "2025-01-01", "2025-06-05"]
historical_end = "2026-10-01"
min_train_opportunities = 15
ml_threshold = 0.55
seed = 42
max_fits = 64
prospective_days = 180
reference_versions = ["v20261012T130540_d2bb6ac0", "v20261012T131650_5106daf4", "v20261012T134917_f88d6f93"]

[rules]
volatility_window = 20
slope_window = 5
minimum_normalized_momentum = 0.5
minimum_efficiency = 0.10
minimum_persistence = 0.55
max_holding_multiplier = 2

[costs]
commission_bps = 10.0
slippage_bps = 5.0
spread_bps = 2.0
annual_holding_bps = 0.0
annual_cash_rate = 0.0
initial_capital = 10000.0

[stress]
cost_multiplier = 2.0

[xgboost]
n_estimators = 120
max_depth = 2
learning_rate = 0.03
subsample = 0.85
colsample_bytree = 0.85
reg_lambda = 10.0
min_child_weight = 10

[bootstrap]
samples = 2000
block_lengths = [7, 30]
confidence = 0.95

[acceptance]
minimum_trades = 20
required_positive_fold_fraction = 0.60
