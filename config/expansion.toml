maximum_gross = 1.0
daily_volatility_floor = 0.0001
[costs]
commission_bps = 10.0
slippage_bps = 5.0
half_spread_bps = 1.0
short_borrow_annual_bps = 300.0
cash_borrow_annual_bps = 500.0
[bootstrap]
samples = 1000
block_lengths = [7, 30]
