schema = 1
[data]
start = "2021-01-01"
end = "2025-07-01"
anchors = ["BTCUSDT", "ETHUSDT"]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT"]
forex = ["EURUSD", "GBPUSD", "USDJPY", "USDCHF", "AUDUSD", "USDCAD", "NZDUSD"]
[research]
boundaries = ["2023-07-01", "2024-01-01", "2025-01-01", "2025-07-01"]
seeds = [42, 1729]
maximum_fits = 72
architectures = ["lstm", "xgboost"]
[training]
sequence_length = 63
validation_days = 180
embargo_days = 1
minimum_train_dates = 180
epochs = 30
patience = 7
batch_dates = 128
hidden_size = 20
learning_rate = 0.001
dropout = 0.2
gradient_clip = 1.0
threads = 2
[risk]
position_mode = "long_only"
